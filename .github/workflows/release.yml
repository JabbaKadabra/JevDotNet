name: Release NuGet package

# Publishes to nuget.org when a version tag (v1.2.3) is pushed.
# The package version comes from the tag, so no need to edit the .csproj per release.
#
# Auth: NuGet Trusted Publishing (OIDC) — no long-lived API key is stored.
# A short-lived key is minted at push time via the NuGet/login action.
# Requires a Trusted Publishing policy configured on nuget.org (see repo docs / PR notes).
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write   # allow GitHub to issue the OIDC token for the nuget.org exchange

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so SourceLink embeds correct commit

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore SystemOneDotNet.sln

      - name: Build
        run: dotnet build SystemOneDotNet.sln -c Release --no-restore

      - name: Test
        run: dotnet test SystemOneDotNet.sln -c Release --no-build --verbosity normal

      - name: Pack
        run: >
          dotnet pack src/SystemOneDotNet/SystemOneDotNet.csproj
          -c Release --no-build
          -p:Version=${{ steps.version.outputs.version }}
          -o ./artifacts

      # Mint the short-lived NuGet API key via OIDC. Key lives ~1h, so do this
      # immediately before the push.
      - name: NuGet login (OIDC -> temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}   # your nuget.org profile username, NOT your email

      - name: Push to nuget.org
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
